<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f7f7f5">
<title>Grow Together</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
:root{
--bg:#f7f7f5;--card:#fff;--habit:#ededeb;--task:#f4f4f2;--text:#171717;
--muted:#777;--line:#deded9;--green:#4f9b68;--green-bg:#e4f1e7;
--danger:#c84b4b;--nav:#fff;--shadow:0 2px 12px rgba(0,0,0,.05)
}
[data-theme="dark"]{
--bg:#111312;--card:#1b1e1c;--habit:#252926;--task:#202421;--text:#f1f1ee;
--muted:#a5a7a5;--line:#343835;--green:#6db782;--green-bg:#203a29;
--danger:#ef7373;--nav:#1b1e1c;--shadow:0 2px 12px rgba(0,0,0,.2)
}
body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,sans-serif;min-height:100vh}
button,input{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}
#auth{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.auth-box{width:100%;max-width:390px}
.logo{text-align:center;font-size:30px;font-weight:800;margin-bottom:8px}
.subtitle{text-align:center;color:var(--muted);margin-bottom:28px}
.auth-card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px;box-shadow:var(--shadow)}
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:7px}
.field input{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--text);outline:none}
.field input:focus{border-color:var(--green)}
.primary{width:100%;padding:13px;border:0;border-radius:12px;background:var(--text);color:var(--bg);font-weight:700}
.switch{text-align:center;color:var(--muted);font-size:13px;margin-top:15px}
.link{border:0;background:none;color:var(--green);font-weight:700;padding:0}
.error{color:var(--danger);font-size:13px;margin-top:10px;line-height:1.4}
#app{max-width:560px;margin:auto;min-height:100vh;padding-bottom:82px}
header{padding:22px 18px 8px}
.date{font-size:14px;color:var(--muted);margin-bottom:4px}
.header-row{display:flex;justify-content:space-between;align-items:center;gap:10px}
h1{font-size:28px;margin:0}
.section{padding:10px 16px}
.section-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.section-title h2{font-size:18px;margin:0}
.progress-wrap{margin:7px 0 16px}
.progress-label{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:6px}
.progress{height:7px;border-radius:99px;background:var(--line);overflow:hidden}
.progress i{display:block;height:100%;background:var(--green);border-radius:99px}
.card{background:var(--habit);border-radius:15px;padding:13px 14px;margin-bottom:9px;box-shadow:var(--shadow)}
.card.task{background:var(--task)}
.card.done{background:var(--green-bg)}
.item-row{display:flex;align-items:center;gap:11px}
.check{width:30px;height:30px;min-width:30px;border:1.5px solid var(--muted);border-radius:50%;display:flex;align-items:center;justify-content:center;background:transparent;color:transparent;font-weight:800}
.done .check{background:var(--green);border-color:var(--green);color:white}
.item-main{flex:1;min-width:0}
.item-name{font-size:15px;line-height:1.25;word-break:break-word}
.done .item-name{text-decoration:line-through;opacity:.65}
.item-meta{font-size:12px;color:var(--muted);margin-top:4px}
.streak{font-size:12px;white-space:nowrap;color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:18px 10px;font-size:14px}
.bottom{position:fixed;left:0;right:0;bottom:0;background:var(--nav);border-top:1px solid var(--line);z-index:20}
.nav{max-width:560px;margin:auto;display:flex;height:66px}
.nav button{flex:1;border:0;background:none;color:var(--muted);font-size:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.nav button.active{color:var(--text);font-weight:700}
.nav-icon{font-size:20px}
.fab{position:fixed;right:max(18px,calc((100vw - 560px)/2 + 18px));bottom:82px;width:50px;height:50px;border:0;border-radius:50%;background:var(--text);color:var(--bg);font-size:26px;box-shadow:var(--shadow);z-index:10}
.panel{padding:16px}
.panel-card{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:16px;margin-bottom:12px}
.panel-card h3{margin:0 0 12px;font-size:16px}
.streaks{display:flex;gap:10px}
.streak-box{flex:1;background:var(--habit);border-radius:14px;padding:14px}
.streak-box .name{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.streak-box .num{font-size:27px;font-weight:800;margin-top:5px}
.menu{position:relative}
.menu-pop{position:absolute;right:0;top:38px;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);min-width:190px;padding:6px;z-index:30}
.menu-pop button{display:block;width:100%;text-align:left;border:0;background:none;color:var(--text);padding:10px;border-radius:8px}
.menu-pop button:hover{background:var(--habit)}
.setting-row{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.setting-row:last-child{border-bottom:0}
.setting-label{font-size:15px}
.setting-sub{font-size:12px;color:var(--muted);margin-top:3px}
.toggle{width:48px;height:28px;border:0;border-radius:20px;background:var(--line);padding:3px}
.toggle i{display:block;width:22px;height:22px;border-radius:50%;background:var(--card);transition:.15s}
.toggle.on{background:var(--green)}
.toggle.on i{transform:translateX(20px)}
.code{font-size:24px;font-weight:800;letter-spacing:3px;margin:8px 0}
.modal-back{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.modal{width:100%;max-width:560px;background:var(--card);border-radius:22px 22px 0 0;padding:20px;max-height:88vh;overflow:auto}
.modal h3{margin:0 0 16px}
.modal-actions{display:flex;gap:9px;margin-top:15px}
.modal-actions button{flex:1;padding:12px;border-radius:11px;border:1px solid var(--line);background:var(--card);color:var(--text)}
.modal-actions .primary{border:0;background:var(--text);color:var(--bg)}
.modal-actions .danger{background:var(--danger);color:white;border:0}
.select-icon{display:grid;grid-template-columns:repeat(6,1fr);gap:7px}
.icon-choice{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px;font-size:20px}
.icon-choice.selected{border-color:var(--green);background:var(--green-bg)}
.toast{position:fixed;left:50%;bottom:76px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 14px;border-radius:10px;font-size:13px;z-index:100;max-width:90%;text-align:center}
.friend{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--habit);display:flex;align-items:center;justify-content:center;font-weight:800}
.friend-main{flex:1}
.friend-name{font-size:14px}
.friend-code{font-size:11px;color:var(--muted)}
.dots{border:0;background:none;color:var(--muted);font-size:22px;padding:4px 7px}
.top-space{display:flex;justify-content:space-between;align-items:center}
.note{font-size:12px;color:var(--muted);line-height:1.4}
</style>
</head>
<body>

<div id="auth">
<div class="auth-box">
<div class="logo">Grow Together</div>
<div class="subtitle">Build habits. Get things done. Grow together.</div>
<div class="auth-card">
<div class="field"><label>Username</label><input id="authUser" autocomplete="username" maxlength="30"></div>
<div class="field"><label>Password</label><input id="authPass" type="password" autocomplete="current-password" minlength="6"></div>
<button class="primary" id="authBtn">Create account</button>
<div class="switch"><span id="switchText">Already have an account?</span> <button class="link" id="switchBtn">Log in</button></div>
<div id="authError" class="error hidden"></div>
</div>
</div>
</div>

<div id="app" class="hidden">
<header>
<div class="date" id="todayDate"></div>
<div class="header-row"><h1 id="pageTitle">Home</h1><div id="headerAction"></div></div>
</header>
<main id="content"></main>
</div>

<button id="fab" class="fab hidden">+</button>

<div class="bottom hidden" id="bottomNav">
<div class="nav">
<button data-tab="home" class="active"><span class="nav-icon">⌂</span>Home</button>
<button data-tab="shared"><span class="nav-icon">⇄</span>Shared</button>
<button data-tab="settings"><span class="nav-icon">⚙</span>Settings</button>
</div>
</div>

<div id="modalRoot"></div>
<div id="toastRoot"></div>

<script>
const SUPABASE_URL="https://uivzhyiqikxxgdoervop.supabase.co";
const SUPABASE_KEY="sb_publishable_H7PvjVCqVBaw4GH1Wvl3mQ_5reXu3x4";
const {createClient}=supabase;
const db=createClient(SUPABASE_URL,SUPABASE_KEY);

let user=null,profile=null,tab="home",personalHabits=[],personalTasks=[],sharedSpaces=[],activeSpace=null;
let sharedHabits=[],sharedTasks=[],friends=[],members=[],completionCache={};
let authMode="signup",realtimeChannel=null;
const icons=["🌅","🏃","📚","💧","🧘","💪","🥗","😴","✍️","🎯","🚶","🧠"];

function today(){
const d=new Date();
return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function prettyDate(){
return new Date().toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric",year:"numeric"});
}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function toast(msg){
const r=document.getElementById("toastRoot");
r.innerHTML=`<div class="toast">${esc(msg)}</div>`;
setTimeout(()=>r.innerHTML="",2600);
}
function errMsg(e){return e?.message||"Something went wrong."}
function fakeEmail(u){return u.trim().toLowerCase()+"@growtogether.local"}
function validUser(u){return /^[a-zA-Z0-9_]{3,30}$/.test(u)}
async function q(promise){
const {data,error}=await promise;
if(error)throw error;
return data;
}
  document.getElementById("switchBtn").onclick=()=>{
authMode=authMode==="signup"?"login":"signup";
document.getElementById("authBtn").textContent=authMode==="signup"?"Create account":"Log in";
document.getElementById("switchText").textContent=authMode==="signup"?"Already have an account?":"New here?";
document.getElementById("switchBtn").textContent=authMode==="signup"?"Log in":"Create account";
document.getElementById("authError").classList.add("hidden");
};

document.getElementById("authBtn").onclick=authSubmit;
document.getElementById("authPass").addEventListener("keydown",e=>{
if(e.key==="Enter")authSubmit()
});

async function authSubmit(){
const u=document.getElementById("authUser").value.trim();
const p=document.getElementById("authPass").value;
const er=document.getElementById("authError");
er.classList.add("hidden");

if(!validUser(u)){
er.textContent="Username must be 3–30 characters using letters, numbers or underscore.";
er.classList.remove("hidden");
return;
}

if(p.length<6){
er.textContent="Password must be at least 6 characters.";
er.classList.remove("hidden");
return;
}

const btn=document.getElementById("authBtn");
btn.disabled=true;
btn.textContent="Please wait…";

try{
if(authMode==="signup"){
const {data,error}=await db.auth.signUp({
email:fakeEmail(u),
password:p
});

if(error)throw error;

if(data.user){
await db.from("profiles").insert({
id:data.user.id,
username:u,
friend_code:makeCode()
});
}

toast("Account created.");

}else{
const {error}=await db.auth.signInWithPassword({
email:fakeEmail(u),
password:p
});

if(error)throw error;
}

}catch(e){
er.textContent=errMsg(e);
er.classList.remove("hidden");
}finally{
btn.disabled=false;
btn.textContent=authMode==="signup"?"Create account":"Log in";
}
}

function makeCode(){
const chars="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
let out="";
for(let i=0;i<6;i++){
out+=chars[Math.floor(Math.random()*chars.length)];
}
return out;
}

db.auth.onAuthStateChange(async(event,session)=>{
if(session?.user){
user=session.user;
setTimeout(startApp,0);
}else{
user=null;
profile=null;
showAuth();
}
});

async function startApp(){
try{
profile=await q(
db.from("profiles")
.select("*")
.eq("id",user.id)
.maybeSingle()
);

if(!profile){
const u=(user.email||"user@").split("@")[0];

profile=await q(
db.from("profiles")
.insert({
id:user.id,
username:u,
friend_code:makeCode()
})
.select()
.single()
);
}

showApp();
await loadAll();

}catch(e){
toast(errMsg(e));
showApp();
}
}

function showAuth(){
document.getElementById("auth").classList.remove("hidden");
document.getElementById("app").classList.add("hidden");
document.getElementById("fab").classList.add("hidden");
document.getElementById("bottomNav").classList.add("hidden");
}

function showApp(){
document.getElementById("auth").classList.add("hidden");
document.getElementById("app").classList.remove("hidden");
document.getElementById("fab").classList.remove("hidden");
document.getElementById("bottomNav").classList.remove("hidden");
document.getElementById("todayDate").textContent=prettyDate();
render();
}

async function loadAll(){
personalHabits=await q(
db.from("habits")
.select("*")
.eq("owner_id",user.id)
.eq("is_shared",false)
.order("created_at")
);

personalTasks=await q(
db.from("tasks")
.select("*")
.eq("owner_id",user.id)
.eq("is_shared",false)
.order("created_at")
);

const memberships=await q(
db.from("shared_space_members")
.select("*")
.eq("user_id",user.id)
);

const ids=memberships.map(x=>x.space_id);

if(ids.length){
sharedSpaces=await q(
db.from("shared_spaces")
.select("*")
.in("id",ids)
);
}else{
sharedSpaces=[];
}

activeSpace=sharedSpaces[0]||null;

await loadFriends();

if(activeSpace){
await loadSpace();
}else{
sharedHabits=[];
sharedTasks=[];
members=[];
}

render();
}

async function loadFriends(){
try{
const rows=await q(
db.from("friendships")
.select("*")
.or(`user_id.eq.${user.id},friend_id.eq.${user.id}`)
);

const ids=[
...new Set(
rows.map(r=>r.user_id===user.id?r.friend_id:r.user_id)
)
];

friends=ids.length?
await q(db.from("profiles").select("*").in("id",ids)):
[];

}catch(e){
friends=[];
}
}

async function loadSpace(){
if(!activeSpace)return;

try{
sharedHabits=await q(
db.from("habits")
.select("*")
.eq("space_id",activeSpace.id)
.eq("is_shared",true)
.order("created_at")
);

sharedTasks=await q(
db.from("tasks")
.select("*")
.eq("space_id",activeSpace.id)
.eq("is_shared",true)
.order("created_at")
);

members=await q(
db.from("shared_space_members")
.select("*")
.eq("space_id",activeSpace.id)
);

}catch(e){
toast(errMsg(e));
}
}

function isAdmin(){
return activeSpace&&activeSpace.admin_id===user.id;
}

async function getCompletion(
itemId,
type,
uid=user.id,
date=today()
){
const table=type==="habit"?"habit_completions":"task_completions";
const col=type==="habit"?"habit_id":"task_id";

try{
const row=await q(
db.from(table)
.select("completed")
.eq(col,itemId)
.eq("user_id",uid)
.eq("completion_date",date)
.maybeSingle()
);

return !!row?.completed;

}catch(e){
return false;
}
}

async function setCompletion(item,type,value){
const table=type==="habit"?"habit_completions":"task_completions";
const col=type==="habit"?"habit_id":"task_id";

try{
const existing=await q(
db.from(table)
.select("id")
.eq(col,item.id)
.eq("user_id",user.id)
.eq("completion_date",today())
.maybeSingle()
);

if(existing){
await q(
db.from(table)
.update({completed:value})
.eq("id",existing.id)
);
}else{
await q(
db.from(table)
.insert({
[col]:item.id,
user_id:user.id,
completion_date:today(),
completed:value
})
);
}

await render();

}catch(e){
toast(errMsg(e));
}
}

async function streak(item,type,uid=user.id){
let n=0;

const table=type==="habit"?"habit_completions":"task_completions";
const col=type==="habit"?"habit_id":"task_id";

try{
const rows=await q(
db.from(table)
.select("completion_date,completed")
.eq(col,item.id)
.eq("user_id",uid)
.order("completion_date",{ascending:false})
.limit(400)
);

const map=new Map(
rows.map(r=>[r.completion_date,r.completed])
);

let d=new Date();

if(!map.get(today())){
d.setDate(d.getDate()-1);
}

for(let i=0;i<400;i++){
const key=
d.getFullYear()+"-"+
String(d.getMonth()+1).padStart(2,"0")+"-"+
String(d.getDate()).padStart(2,"0");

if(map.get(key)===true){
n++;
}else{
break;
}

d.setDate(d.getDate()-1);
}

}catch(e){}

return n;
}

async function itemDone(item,type){
return await getCompletion(item.id,type);
}

async function render(){
document.getElementById("todayDate").textContent=prettyDate();

const title={
home:"Home",
shared:activeSpace?.name||"Shared",
settings:"Settings"
}[tab];

document.getElementById("pageTitle").textContent=title;

document.querySelectorAll(".nav button").forEach(b=>{
b.classList.toggle("active",b.dataset.tab===tab);
});

document.getElementById("fab").classList.toggle(
"hidden",
tab==="settings"
);

document.getElementById("headerAction").innerHTML=
tab==="shared"&&activeSpace?
`<div class="menu">
<button class="dots" id="menuBtn">⋮</button>
<div class="menu-pop hidden" id="menuPop">
<button onclick="showFriendsModal()">Manage friends</button>
${isAdmin()?
'<button onclick="showSpaceItemsModal()">Manage shared items</button>':
''}
</div>
</div>`:"";

const c=document.getElementById("content");

if(tab==="home")await renderHome(c);
if(tab==="shared")await renderShared(c);
if(tab==="settings")renderSettings(c);

document.getElementById("menuBtn")?.addEventListener(
"click",
()=>{
document.getElementById("menuPop").classList.toggle("hidden")
}
);
}

async function renderHome(c){
let shDone=0;
let spTotal=sharedHabits.length+sharedTasks.length;
let phDone=0;
let ppTotal=personalHabits.length+personalTasks.length;

for(const x of sharedHabits){
if(await itemDone(x,"habit"))shDone++;
}

for(const x of sharedTasks){
if(await itemDone(x,"task"))shDone++;
}

for(const x of personalHabits){
if(await itemDone(x,"habit"))phDone++;
}

for(const x of personalTasks){
if(await itemDone(x,"task"))phDone++;
}

c.innerHTML="";

c.insertAdjacentHTML(
"beforeend",
sectionHTML("Shared",shDone,spTotal)
);

if(spTotal){
c.insertAdjacentHTML(
"beforeend",
`<div id="homeShared"></div>`
);
}else{
c.insertAdjacentHTML(
"beforeend",
`<div class="section">
<div class="empty">No shared space yet.</div>
</div>`
);
}

c.insertAdjacentHTML(
"beforeend",
sectionHTML("Personal",phDone,ppTotal)
);

c.insertAdjacentHTML(
"beforeend",
`<div class="section">
<div id="homePersonal"></div>
</div>`
);

const hs=document.getElementById("homeShared");
const hp=document.getElementById("homePersonal");

if(hs){
const all=[
...sharedHabits.map(x=>({...x,_type:"habit"})),
...sharedTasks.map(x=>({...x,_type:"task"}))
];

await renderItems(hs,all,false,true);
}

const allp=[
...personalHabits.map(x=>({...x,_type:"habit"})),
...personalTasks.map(x=>({...x,_type:"task"}))
];

await renderItems(hp,allp,true,false);
}

function sectionHTML(name,done,total){
const pct=total?Math.round(done/total*100):0;

return `
<div class="section">
<div class="section-title">
<h2>${name}</h2>
</div>

<div class="progress-wrap">
<div class="progress-label">
<span>${done} of ${total} complete</span>
<span>${pct}%</span>
</div>

<div class="progress">
<i style="width:${pct}%"></i>
</div>
</div>
</div>`;
}
  async function renderItems(container,items,editable,sharedPreview){
if(!items.length){
container.innerHTML=`<div class="empty">Nothing here yet.</div>`;
return;
}

const states=[];

for(const x of items){
states.push({
...x,
done:await itemDone(x,x._type),
streak:x._type==="habit"?await streak(x,"habit"):0
});
}

states.sort((a,b)=>Number(a.done)-Number(b.done));

container.innerHTML=states
.map(x=>itemHTML(x,editable,sharedPreview))
.join("");

container.querySelectorAll("[data-complete]").forEach(b=>{
b.onclick=()=>{
const item=states.find(x=>x.id===b.dataset.complete);
setCompletion(
item,
b.dataset.type,
!b.dataset.done
);
};
});

container.querySelectorAll("[data-edit]").forEach(b=>{
b.onclick=()=>{
const item=states.find(x=>x.id===b.dataset.edit);
showEditModal(
item,
b.dataset.type,
b.dataset.shared==="true"
);
};
});

container.querySelectorAll("[data-delete]").forEach(b=>{
b.onclick=()=>{
const item=states.find(x=>x.id===b.dataset.delete);
confirmDelete(
item,
b.dataset.type,

async function addFriend(){

const code=
document.getElementById("friendCode")
.value.trim()
.toUpperCase();

if(code.length!==6){

toast("Enter a valid 6-character Friend Code.");

return;
}

try{

const target=await q(
db.from("profiles")
.select("*")
.eq("friend_code",code)
.maybeSingle()
);

if(!target){

toast("Friend Code not found.");

return;
}

if(target.id===user.id){

toast("You cannot add yourself.");

return;
}

if(friends.some(f=>f.id===target.id)){

toast("Already added.");

return;
}

await q(
db.from("friendships")
.insert({
user_id:user.id,
friend_id:target.id
})
);

friends.push(target);

document.getElementById("friendCode").value="";

renderFriendList();

toast("Friend added.");

}catch(e){

toast(errMsg(e));
}
}

async function removeFriend(id){

if(!confirm("Remove this friend?"))return;

try{

await q(
db.from("friendships")
.delete()
.or(
`and(user_id.eq.${user.id},friend_id.eq.${id}),and(user_id.eq.${id},friend_id.eq.${user.id})`
)
);

friends=friends.filter(f=>f.id!==id);

renderFriendList();

toast("Friend removed.");

}catch(e){

toast(errMsg(e));
}
}

async function setupRealtime(){

if(!user)return;

if(realtimeChannel){

await db.removeChannel(
realtimeChannel
);

}

realtimeChannel=
db.channel("grow-together-"+user.id)

.on(
"postgres_changes",
{
event:"*",
schema:"public",
table:"habit_completions"
},
()=>{
loadAll();
}
)

.on(
"postgres_changes",
{
event:"*",
schema:"public",
table:"task_completions"
},
()=>{
loadAll();
}
)

.on(
"postgres_changes",
{
event:"*",
schema:"public",
table:"habits"
},
()=>{
loadAll();
}
)

.on(
"postgres_changes",
{
event:"*",
schema:"public",
table:"tasks"
},
()=>{
loadAll();
}
)

.on(
"postgres_changes",
{
event:"*",
schema:"public",
table:"friendships"
},
()=>{
loadFriends().then(()=>render());
}
)

.subscribe();
}
